name: Auto Update Song List

on:
  workflow_dispatch: # 由 WDC 定时分发或手动触发

permissions:
  contents: write # 赋予提交代码权限

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 准备探针状态目录
        run: mkdir -p reports

      - name: 恢复 BV 探针状态
        uses: actions/cache@v4
        with:
          path: reports/github-bv-sampling-state.json
          key: ${{ runner.os }}-github-bv-sampling-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-github-bv-sampling-

      - name: 配置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 验证更新脚本回归
        run: |
          node --test scripts/update-songs-guard.test.js scripts/bilibili-page-api.test.js scripts/bvid-probe-selection.test.js
          node scripts/check-title-cleaning.js
          bash deploy/wdc/v-slice-browser-dispatch.test.sh

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm-dev libxkbcommon-dev libgbm-dev libasound-dev libatspi2.0-0 libxshmfence-dev

      - name: 安装Puppeteer（跳过Chrome下载）
        run: |
          export PUPPETEER_SKIP_DOWNLOAD=true
          npm install -g puppeteer@21.0.0
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome" >> $GITHUB_ENV

      - name: 执行更新脚本（失败来源保留旧文件）
        run: |
          cd scripts
          node update-songs.js

      - name: 检查数据更新
        id: check_changes
        run: |
          if git status --porcelain -- data/*.js data/index.json | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 提交更新（仅当有变化时）
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          start_commit="$(git rev-parse HEAD)"
          git fetch origin main
          remote_commit="$(git rev-parse origin/main)"
          if [ "$start_commit" != "$remote_commit" ]; then
            echo "main 在抓取期间已前进，拒绝合并生成文件；等待下一轮基于最新 main 重跑"
            exit 1
          fi

          git add -- data/*.js data/index.json
          if git diff --cached --quiet; then
            echo "没有需要提交的数据变化"
            exit 0
          fi

          git commit -m "🤖 自动更新歌单数据（部分失败见日志）"
          git push origin HEAD:main
          echo "数据更新已推送到 main"
