server {
    listen 80;
    server_name www.culua.com;
    return 301 https://www.culua.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.culua.com;

    ssl_certificate /etc/nginx/certs/culua.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/culua.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:culua_song_search:10m;
    ssl_session_tickets off;

    root /srv/culua-web/current;
    index index.html;

    location /api/ {
        proxy_pass http://localhost:3230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /feishu-bridge/ {
        client_max_body_size 80m;
        proxy_pass http://localhost:39240/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feishu-bridge {
        return 301 /feishu-bridge/;
    }

    location = /stats    { try_files /stats.html =404; }
    location = /bv       { try_files /bv-dup-check.html =404; }
    location = /dup      { try_files /title-artist-dup-check.html =404; }
    location = /check    { try_files /title-artist-check.html =404; }
    location = /vocaloid { try_files /vocaloid.html =404; }
    location = /growth   { try_files /song-growth.html =404; }
    location = /convert  { try_files /converter.html =404; }
    location = /legacy   { try_files /bili-check.html =404; }

    location = /stats/    { return 301 /stats; }
    location = /bv/       { return 301 /bv; }
    location = /dup/      { return 301 /dup; }
    location = /check/    { return 301 /check; }
    location = /vocaloid/ { return 301 /vocaloid; }
    location = /growth/   { return 301 /growth; }
    location = /convert/  { return 301 /convert; }
    location = /legacy/   { return 301 /legacy; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
